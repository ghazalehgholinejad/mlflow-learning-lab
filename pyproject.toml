[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-learning-lab"
version = "1.1.0"
description = "A bilingual, hands-on course for learning MLOps fundamentals with MLflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.8,<4",
  "mlflow>=3.0,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["mlflow_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
